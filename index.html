<!DOCTYPE html>
<html>
<head>
    <title>BOSS CONTROL PANEL</title>
    <style>
        body { background: #1a1a1a; color: #00ff00; text-align: center; font-family: sans-serif; }
        button { 
            padding: 20px; width: 80%; margin: 10px; font-size: 20px; 
            background: #333; color: #00ff00; border: 2px solid #00ff00; border-radius: 10px;
        }
        button:active { background: #00ff00; color: #000; }
    </style>
</head>
<body>
    <h1>🛰 ПУЛЬТ УПРАВЛЕНИЯ ХАОСОМ 🛰</h1>
    <button onclick="send('jump')">ПРЫЖОК! 🚀</button>
    <button onclick="send('tp')">ТП К МАКСУ! 🌀</button>
    <button onclick="send('kill')">УБИТЬ ЖАДИНУ! 💀</button>
    <button onclick="send('say')">ЗАСТАВИТЬ ГОВОРИТЬ! 🗣️</button>

    <script>
        // Ссылка на твоего БОТА на Render
        const BOT_URL = 'https://slobos-afk-aternos-bot-5u1o.onrender.com'; 

        function send(cmd) {
            fetch(`${BOT_URL}/boss-command?type=${cmd}`)
            .then(() => console.log('Сигнал отправлен!'))
            .catch(() => alert('Ошибка! Проверь ссылку на бота.'));
        }
    </script>
</body>
</html>
